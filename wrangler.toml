# Cloudflare Pages configuration. See docs/deploy.md and ADR 0002/0003.
#
# Pages environments do NOT inherit bindings or vars (vars, d1_databases, r2_buckets are
# non-inheritable), so `preview` and `production` each declare their own full set.
# Top-level values are used only for local development (`wrangler pages dev`).
#
# Secrets are never stored here. Set them with:
#   npx wrangler pages secret put <NAME> --project-name scot-free-cleaning [--env preview]
# Required secrets: TURNSTILE_SECRET_KEY, NOTIFY_EMAIL, ADMIN_EMAILS, RATE_LIMIT_SALT
# Optional secrets: RESEND_API_KEY

name = "scot-free-cleaning"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# ---------- local development ----------
# Fail closed: anything that falls back to these top-level values runs as production (no admin
# bypass, no test Turnstile secrets). Local development opts in via .dev.vars (ENVIRONMENT=development).
[vars]
ENVIRONMENT = "production"
SEND_CUSTOMER_EMAILS = "false"

[[d1_databases]]
binding = "DB"
database_name = "scot-free-cleaning-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "scot-free-cleaning-uploads-local"

# ---------- preview deployments (non-production branches) ----------
[env.preview.vars]
ENVIRONMENT = "preview"
SEND_CUSTOMER_EMAILS = "false"
ACCESS_TEAM_DOMAIN = ""          # e.g. https://<team>.cloudflareaccess.com  (PLAN.md B5)
ACCESS_AUD = ""                  # Access application AUD tag               (PLAN.md B5)
MAIL_FROM = ""                   # e.g. "Scot-Free Cleaning <alerts@yourdomain>" (PLAN.md B6)
TURNSTILE_ALLOWED_HOSTNAMES = "" # comma-separated, e.g. "<branch>.scot-free-cleaning.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "scot-free-cleaning-preview"
database_id = "00000000-0000-0000-0000-000000000000" # PLAN.md B3: replace after `wrangler d1 create`
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "UPLOADS"
bucket_name = "scot-free-cleaning-uploads-preview"

# ---------- production ----------
[env.production.vars]
ENVIRONMENT = "production"
SEND_CUSTOMER_EMAILS = "false"   # set "true" only after a sending domain is verified (ADR 0007)
ACCESS_TEAM_DOMAIN = ""          # PLAN.md B5
ACCESS_AUD = ""                  # PLAN.md B5
MAIL_FROM = ""                   # PLAN.md B6
TURNSTILE_ALLOWED_HOSTNAMES = "scot-free-cleaning.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "scot-free-cleaning"
database_id = "00000000-0000-0000-0000-000000000000" # PLAN.md B3: replace after `wrangler d1 create`
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "scot-free-cleaning-uploads"
