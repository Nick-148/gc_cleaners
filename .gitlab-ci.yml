# GitLab CI/CD for Scot-Free Cleaning (docs/deploy.md).
#
# verify → e2e → deploy
#   - Every branch and merge request: format, lint, typecheck, audit, unit + integration tests, build, e2e.
#   - Non-default branches: preview deploy to <branch>.scot-free-cleaning.pages.dev (when Cloudflare is set up).
#   - Default branch: production deploy, started manually, gated by the launch-readiness check.
#
# Required CI/CD variables for deploys (Settings → CI/CD → Variables):
#   CLOUDFLARE_API_TOKEN       masked + protected; token with "Cloudflare Pages: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID      protected
#   PUBLIC_TURNSTILE_SITE_KEY  the production Turnstile site key (public value)
# Deploy jobs are skipped entirely until CLOUDFLARE_API_TOKEN exists (PLAN.md B3).

# Branch pipelines only: they run for every push (with or without an open MR, whose widget shows
# the branch pipeline) and always have CI_COMMIT_BRANCH, which the preview deploy relies on.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - verify
  - test
  - deploy

variables:
  NODE_IMAGE: node:24.22.0-bookworm-slim
  npm_config_cache: $CI_PROJECT_DIR/.npm

.npm:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push
  before_script:
    - npm ci --prefer-offline --no-audit

verify:
  stage: verify
  image: $NODE_IMAGE
  extends: .npm
  script:
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm audit --omit=dev
    - npm test
    - npm run build

e2e:
  stage: test
  # Version must match @playwright/test in package.json.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  extends: .npm
  needs: [verify]
  script:
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml

.deploy:
  stage: deploy
  image: $NODE_IMAGE
  extends: .npm
  needs: [verify, e2e]
  interruptible: false

deploy_preview:
  extends: .deploy
  rules:
    - if: $CLOUDFLARE_API_TOKEN && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  resource_group: preview
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG.scot-free-cleaning.pages.dev
  script:
    - npm run build
    - npx wrangler d1 migrations apply DB --remote --env preview
    - npx wrangler pages deploy dist --project-name scot-free-cleaning --branch "$CI_COMMIT_REF_SLUG"

deploy_production:
  extends: .deploy
  rules:
    - if: $CLOUDFLARE_API_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: false
  resource_group: production
  environment:
    name: production
    url: https://scot-free-cleaning.pages.dev
  script:
    - npm run check:launch
    - npm run build
    - npx wrangler d1 migrations apply DB --remote --env production
    - npx wrangler pages deploy dist --project-name scot-free-cleaning --branch main
