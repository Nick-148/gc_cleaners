# CI/CD for Scot-Free Cleaning (ADR 0013, docs/deploy.md §6).
#
# verify → e2e → deploy
#   - Every push to any branch: format, lint, typecheck, audit, unit + integration tests, build, e2e.
#   - Non-main branches: preview deploy to <branch>.scot-free-cleaning.pages.dev.
#   - main: production deploy through the `production` environment (add required reviewers there for
#     a manual approval step), gated by the launch-readiness check.
#
# Deploy jobs are skipped until the repository variable CLOUDFLARE_ACCOUNT_ID exists (PLAN.md B3).
# Settings → Secrets and variables → Actions:
#   secret   CLOUDFLARE_API_TOKEN       "Cloudflare Pages: Edit" + "D1: Edit"
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable PUBLIC_TURNSTILE_SITE_KEY  the Turnstile site key (public value)
#
# Actions are pinned to full commit SHAs from releases at least 7 days old (ADR 0009).

name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight main pipeline: it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Browsers are preinstalled; the tag must match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-preview:
    name: Deploy preview
    needs: [verify, e2e]
    if: ${{ github.ref != 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    concurrency:
      group: deploy-preview-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - run: npx wrangler d1 migrations apply DB --remote --env preview
      - run: npx wrangler pages deploy dist --project-name scot-free-cleaning --branch "$GITHUB_REF_NAME"

  deploy-production:
    name: Deploy production
    needs: [verify, e2e]
    if: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://scot-free-cleaning.pages.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check:launch
      - run: npm run build
      - run: npx wrangler d1 migrations apply DB --remote --env production
      - run: npx wrangler pages deploy dist --project-name scot-free-cleaning --branch main
